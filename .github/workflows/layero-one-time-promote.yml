name: One-time Layero production promotion

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/layero-one-time-promote.yml'

permissions:
  contents: read

jobs:
  promote:
    # This workflow is intentionally one-shot; future main pushes cannot republish production.
    if: "github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'ops: promote current main build to Layero production')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAYERO_TOKEN: ${{ secrets.LAYERO_TOKEN }}
      LAYERO_NO_UPDATE_CHECK: '1'
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@v4

      - name: Resolve the existing Layero project and promote this main build
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${LAYERO_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret LAYERO_TOKEN. Create a CI token at https://app.layero.ru/settings/cli and add it in GitHub → Settings → Secrets and variables → Actions. No production change was made."
            exit 1
          fi

          export LAYERO_JSON=1
          PROJECTS_FILE="$RUNNER_TEMP/layero-projects.jsonl"
          DOMAINS_FILE="$RUNNER_TEMP/layero-domains.jsonl"
          DEPLOYS_FILE="$RUNNER_TEMP/layero-deploys.jsonl"
          PROMOTE_FILE="$RUNNER_TEMP/layero-promote.jsonl"

          npx --yes layero@latest projects list --json > "$PROJECTS_FILE"

          PROJECT_INFO="$(node - "$PROJECTS_FILE" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require("node:fs");
          const [file, repository] = process.argv.slice(2);
          const events = fs.readFileSync(file, "utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const projects = events.filter((e) => e.event === "projects").flatMap((e) => e.projects || []);
          const matches = projects.filter((p) => (p.repo || "").toLowerCase() === repository.toLowerCase());
          if (matches.length !== 1) {
            console.error(`Expected exactly one Layero project linked to ${repository}; found ${matches.length}. No production change was made.`);
            process.exit(1);
          }
          const p = matches[0];
          if (!p.id || !p.slug || !/^[a-z0-9-]+$/.test(p.slug)) {
            console.error("Layero returned an invalid project identity. No production change was made.");
            process.exit(1);
          }
          console.error(`Resolved the linked Layero project: ${p.slug} (${p.source_type || "source type unavailable"}).`);
          process.stdout.write(JSON.stringify({id:p.id,slug:p.slug}));
          NODE
          )"
          LAYERO_PROJECT_ID="$(jq -r '.id' <<< "$PROJECT_INFO")"
          LAYERO_PROJECT_SLUG="$(jq -r '.slug' <<< "$PROJECT_INFO")"
          if [[ -z "$LAYERO_PROJECT_ID" || -z "$LAYERO_PROJECT_SLUG" || "$LAYERO_PROJECT_ID" == "null" ]]; then
            echo "::error::Could not resolve the Layero project ID and slug. No production change was made."
            exit 1
          fi
          export LAYERO_PROJECT_ID LAYERO_PROJECT_SLUG
          printf 'LAYERO_PROJECT_ID=%s\nLAYERO_PROJECT_SLUG=%s\n' "$LAYERO_PROJECT_ID" "$LAYERO_PROJECT_SLUG" >> "$GITHUB_ENV"

          VERIFY_FILE="$RUNNER_TEMP/layero-domain-verify.jsonl"
          npx --yes layero@latest domains verify bukleb.ru --project "$LAYERO_PROJECT_SLUG" --json > "$VERIFY_FILE"
          node - "$VERIFY_FILE" <<'NODE'
          const fs = require("node:fs");
          const events = fs.readFileSync(process.argv[2], "utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const result = events.find((e) => e.event === "domain_verified" && e.domain === "bukleb.ru");
          if (!result) {
            console.error("Layero did not return a verification result for bukleb.ru. No production change was made.");
            process.exit(1);
          }
          const checks = result.checks || {};
          console.log(
            `Domain bukleb.ru: verified=${result.verified}, ssl_status=${result.ssl_status}, ` +
            `A=${checks.a_ok ?? "unknown"}, CNAME=${checks.cname_ok ?? "unknown"}, ` +
            `TXT=${checks.txt_ok ?? "unknown"}, ownership=${checks.ownership_ok ?? "unknown"}.`
          );
          if (result.error) console.log(`Layero domain diagnostic: ${String(result.error).slice(0, 500)}`);
          if (
            result.verified !== true ||
            checks.a_ok !== true ||
            checks.txt_ok !== true ||
            checks.ownership_ok !== true ||
            !["active", "issued"].includes(result.ssl_status)
          ) {
            console.error("Layero domain ownership/DNS is not verified or its certificate status is not issued/active. No production change was made.");
            process.exit(1);
          }
          NODE

          # Layero can report ssl_status=issued while the externally served certificate is already valid.
          # Require a normal HTTPS request (curl verifies hostname and trust chain; no -k) before promoting.
          tls_status="$(curl --silent --show-error --location --max-time 2          # First prove that the CLI understands this checkout as the already-linked GitHub project.
          PLAN_FILE="$RUNNER_TEMP/layero-plan.jsonl"
          DEPLOY_FILE="$RUNNER_TEMP/layero-cli-deploy.jsonl"
          npx --yes layero@latest deploy --project "$LAYERO_PROJECT_ID" --prod --promote --yes --dry-run --json > "$PLAN_FILE"
          node - "$PLAN_FILE" "$LAYERO_PROJECT_ID" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require("node:fs");
          const [file, projectId, repository] = process.argv.slice(2);
          const events = fs.readFileSync(file, "utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const plan = events.find((e) => e.event === "plan");
          if (!plan) { console.error("Layero did not return a deployment plan."); process.exit(1); }
          const project = plan.project || {};
          console.log(`Layero dry-run: project=${project.slug || "unknown"}, type=${plan.runtime_kind || plan.framework || "unknown"}, repo=${project.repo || "none"}, replaces_live_site=${plan.replaces_live_site}.`);
          if (project.id !== projectId || (project.repo || "").toLowerCase() !== repository.toLowerCase() || plan.creates_project !== false || plan.replaces_live_site !== true) {
            console.error("Dry-run did not resolve the existing linked repository project and an explicit production deployment. No production change was made.");
            process.exit(1);
          }
          if (plan.project_settings !== "read") { console.error("Layero project settings were not readable; no production change was made."); process.exit(1); }
          if (!["ssr_next","node_web","python_web","flask","streamlit","gradio"].includes(plan.runtime_kind)) {
            console.error(`Unexpected runtime kind: ${plan.runtime_kind || "none"}; no production change was made.`);
            process.exit(1);
          }
          NODE

          # Deploy this exact checked-out main tree through the linked Layero project.
          # --prod targets production; --promote pins the completed build to the live apex.
          npx --yes layero@latest deploy --project "$LAYERO_PROJECT_ID" --prod --promote --yes --json > "$DEPLOY_FILE"
          node - "$DEPLOY_FILE" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require("node:fs");
          const [file, repository] = process.argv.slice(2);
          const events = fs.readFileSync(file, "utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const ready = events.find((e) => e.event === "ready");
          if (!ready || !ready.deploy_id || ready.edge_ready !== true || !ready.url) {
            console.error("Layero did not confirm a serving production deployment.");
            process.exit(1);
          }
          const url = new URL(ready.url);
          if (url.protocol !== "https:" || url.hostname !== "bukleb.ru") {
            console.error(`Layero returned unexpected production URL: ${ready.url}`);
            process.exit(1);
          }
          console.log(`Layero CLI deployment is ready and serving: ${ready.url} (deploy ${ready.deploy_id}).`);
          NODE

  const promoted = events.find((e) => e.event === "promoted");
          if (!promoted || !promoted.url || !promoted.deploy_id) {
            console.error("Layero did not confirm the production pointer change.");
            process.exit(1);
          }
          console.log(`Layero confirmed production promotion: ${promoted.url} (deploy ${promoted.deploy_id}).`);
          NODE

          homepage="$RUNNER_TEMP/homepage.html"
          creative="$RUNNER_TEMP/creative.html"
          discussions="$RUNNER_TEMP/discussions.html"
          sitemap="$RUNNER_TEMP/sitemap.xml"
          key_body="$RUNNER_TEMP/indexnow-key.txt"

          verified=0
          for attempt in $(seq 1 12); do
            home_status="$(curl --silent --show-error --location --max-time 25 --output "$homepage" --write-out '%{http_code}' 'https://bukleb.ru/' || true)"
            if [[ "$home_status" == "200" ]] && grep -Fq 'Книжное сообщество для читателей' "$homepage"; then
              verified=1
              break
            fi
            echo "Waiting for promoted SEO HTML (attempt $attempt/12; HTTP $home_status)."
            sleep 5
          done
          if [[ "$verified" -ne 1 ]]; then
            echo "::error::Production was promoted but the expected homepage title was not verified. Check Layero runtime/build logs before retrying."
            exit 1
          fi

          creative_status="$(curl --silent --show-error --location --max-time 25 --output "$creative" --write-out '%{http_code}' 'https://bukleb.ru/creative' || true)"
          discussions_status="$(curl --silent --show-error --location --max-time 25 --output "$discussions" --write-out '%{http_code}' 'https://bukleb.ru/discussions' || true)"
          if [[ "$creative_status" != "200" ]] || ! grep -Fq 'Авторское творчество: рассказы, стихи и эссе' "$creative"; then
            echo "::error::The /creative page does not expose the new section metadata."
            exit 1
          fi
          if [[ "$discussions_status" != "200" ]] || ! grep -Fq 'Обсуждения книг: мнения и читательские разговоры' "$discussions"; then
            echo "::error::The /discussions page does not expose the new section metadata."
            exit 1
          fi

          sitemap_status="$(curl --silent --show-error --location --max-time 25 --output "$sitemap" --write-out '%{http_code}' 'https://bukleb.ru/sitemap.xml' || true)"
          if [[ "$sitemap_status" != "200" ]] || ! grep -Fq 'https://bukleb.ru/' "$sitemap"; then
            echo "::error::Production sitemap is unavailable or does not contain the canonical domain."
            exit 1
          fi

          KEY='7846d99d4d624f7699036567738094ae'
          key_status="$(curl --silent --show-error --location --max-time 25 --output "$key_body" --write-out '%{http_code}' "https://bukleb.ru/${KEY}.txt" || true)"
          if [[ "$key_status" != "200" ]] || [[ "$(tr -d '\r\n' < "$key_body")" != "$KEY" ]]; then
            echo "::error::The live IndexNow key file is missing or has the wrong content."
            exit 1
          fi

          urls='[
            "https://bukleb.ru/",
            "https://bukleb.ru/books",
            "https://bukleb.ru/posts",
            "https://bukleb.ru/news",
            "https://bukleb.ru/creative",
            "https://bukleb.ru/discussions"
          ]'
          payload="$(jq -n --arg host "bukleb.ru" --arg key "$KEY" --arg keyLocation "https://bukleb.ru/${KEY}.txt" --argjson urlList "$urls" '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')"
          indexnow_response="$RUNNER_TEMP/indexnow-response.txt"
          indexnow_status="$(curl --silent --show-error --max-time 30 --request POST --header 'Content-Type: application/json; charset=utf-8' --data-binary "$payload" --output "$indexnow_response" --write-out '%{http_code}' 'https://api.indexnow.org/indexnow' || true)"
          case "$indexnow_status" in
            200|202)
              echo "IndexNow accepted six updated public URLs (HTTP $indexnow_status)."
              ;;
            *)
              echo "::error::Layero production is live, but IndexNow rejected the submission (HTTP ${indexnow_status:-unknown})."
              exit 1
              ;;
          esac

          echo "SEO release verified on bukleb.ru and the six public landing pages were submitted to IndexNow."
