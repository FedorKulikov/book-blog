name: Recovery and email Hook verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/verify-edge-hook-secret.ts'
      - '.github/workflows/recovery-verify.yml'

permissions:
  contents: read

concurrency:
  group: edge-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
          cache: true

      - name: Edge Function unit tests
        run: deno test --allow-env supabase/functions/

      - name: Edge Function type check
        run: |
          deno check \
            supabase/functions/recovery/index.ts \
            supabase/functions/auth-email-hook/index.ts \
            supabase/functions/resend-mailer/index.ts

      - name: TypeScript check
        run: npx tsc --noEmit
