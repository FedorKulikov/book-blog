name: Web quality checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/web-quality.yml'
      - '.github/workflows/layero-one-time-promote.yml'

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/layero-one-time-promote.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # The repository-wide lint currently reports unrelated baseline issues.
      # Lint every new page/component and check the two legacy files touched here,
      # suppressing only their pre-existing rules (explicit any / state-in-effect).
      - name: ESLint changed code
        run: |
          npx eslint \
            app/login/page.tsx \
            app/forgot-password/page.tsx \
            app/recover-account/page.tsx \
            app/auth/confirm/page.tsx \
            app/auth/reset/page.tsx \
            app/components/CodesReveal.tsx \
            app/components/BookmarkButton.tsx \
            app/components/LikeButton.tsx \
            app/components/Comments.tsx \
            app/messages/page.tsx \
            app/news/new/page.tsx \
            app/books/add/page.tsx \
            app/profile/edit/page.tsx \
            app/support/'[id]'/page.tsx \
            app/post/'[id]'/edit/page.tsx \
            lib/auth-navigation.ts \
            proxy.ts
          npx eslint app/signup/page.tsx --rule 'react-hooks/set-state-in-effect: off'
          npx eslint app/profile/page.tsx --rule '@typescript-eslint/no-explicit-any: off'
          npx eslint \
            app/page.tsx app/books/page.tsx app/posts/page.tsx \
            app/creative/page.tsx app/discussions/page.tsx \
            'app/post/[id]/page.tsx' 'app/book/[id]/page.tsx' \
            app/layout.tsx app/sitemap.ts app/components/JsonLd.tsx \
            next.config.ts
          npx eslint app/HomeClient.tsx --rule '@typescript-eslint/no-explicit-any: off'

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://bukleb.ru
        run: npm run build
