name: Web quality checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/web-quality.yml'
      - '.github/workflows/layero-one-time-promote.yml'

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/layero-one-time-promote.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # Lint the new guide and all existing SEO files touched by this PR.
      - name: ESLint changed code
        run: |
          npx eslint \
            app/page.tsx \
            app/books/page.tsx \
            app/posts/page.tsx \
            app/creative/page.tsx \
            app/discussions/page.tsx \
            'app/post/[id]/page.tsx' \
            'app/book/[id]/page.tsx' \
            app/layout.tsx \
            app/sitemap.ts \
            app/components/JsonLd.tsx \
            'app/guides/kak-napisat-retsenziyu-na-knigu/page.tsx' \
            next.config.ts
          npx eslint app/HomeClient.tsx --rule '@typescript-eslint/no-explicit-any: off'

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://bukleb.ru
        run: npm run build
