name: Web quality checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/web-quality.yml'
      - '.github/workflows/apply-migrations.yml'
      - '.github/ops/apply-migrations-once.marker'
      - '.github/workflows/layero-one-time-promote.yml'

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify removed recovery-code client paths
        run: |
          set -eu
          if git grep -n -E 'recover-account|CodesReveal' -- app lib proxy.ts next.config.ts; then
            echo "::error::Retired recovery route or CodesReveal reference remains in application code."
            exit 1
          fi
          # Exclude /api/email-recovery/status: it belongs to the active email-verification flow.
          matches="$(git grep -n -E 'recovery/generate|recovery/status|recovery/redeem' -- app lib scripts tests | grep -v '/api/email-recovery/' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Retired /api/recovery code route reference remains in app, lib, scripts, or tests."
            exit 1
          fi
          if grep -Ein 'резервн.{0,25}код|/recover-account|/api/recovery/' README.md; then
            echo "::error::README still documents recovery codes or retired routes."
            exit 1
          fi

      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color \
            .github/workflows/apply-migrations.yml \
            .github/workflows/layero-one-time-promote.yml \
            .github/workflows/layero-deploy-main-once.yml \
            .github/workflows/web-quality.yml \
            .github/workflows/enrich-book-descriptions.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prevent wildcard SELECT on profiles
        run: npm run check:profile-selects

      - name: Auth navigation regression tests
        run: npm run test:auth-navigation

      - name: Verified email recovery tests
        run: npm run test:email-recovery

      - name: Chat media path tests
        run: npm run test:chat-media-paths

      - name: Distribution consent flow tests
        run: npm run test:distribution-consent

      - name: Hashtag normalization tests
        run: npm run test:tags

      - name: Book SEO rules tests
        run: npm run test:book-seo

      - name: Open Library book-description backfill tests
        run: npm run test:book-description-enrichment

      - name: Public profile consent tests
        run: npm run test:profile-public-consent

      - name: TypeScript
        run: npx tsc --noEmit

      # Keep auth, navigation, and main feed code under normal ESLint rules.
      - name: ESLint changed code
        run: |
          npx eslint \
            app/login/page.tsx \
            app/signup/page.tsx \
            app/forgot-password/page.tsx \
            app/api/email-recovery/status/route.ts \
            app/api/email-recovery/request/route.ts \
            app/api/email-recovery/reset-request/route.ts \
            app/api/email-recovery/confirm/route.ts \
            app/api/auth/email-hook/route.ts \
            app/components/EmailRecoverySecurity.tsx \
            app/components/EmailRecoveryResetForm.tsx \
            app/email-recovery/confirm/page.tsx \
            app/email-recovery/confirm/EmailRecoveryConfirmClient.tsx \
            app/auth/confirm/page.tsx \
