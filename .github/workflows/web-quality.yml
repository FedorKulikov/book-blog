name: Web quality checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/web-quality.yml'

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # The repository-wide lint currently reports unrelated baseline issues.
      # Lint every new page/component and check the two legacy files touched here,
      # suppressing only their pre-existing rules (explicit any / state-in-effect).
      - name: ESLint changed code
        run: |
          npx eslint \
            app/page.tsx \
            app/books/page.tsx \
            app/posts/page.tsx \
            app/creative/page.tsx \
            app/discussions/page.tsx \
            'app/post/[id]/page.tsx' \
            'app/book/[id]/page.tsx' \
            app/layout.tsx \
            app/sitemap.ts \
            app/components/JsonLd.tsx \
            app/components/YandexMetrika.tsx \
            app/components/CookieSettingsButton.tsx \
            app/privacy/page.tsx \
            app/rules/page.tsx \
            next.config.ts
          npx eslint app/signup/page.tsx --rule 'react-hooks/set-state-in-effect: off'
          npx eslint app/HomeClient.tsx --rule '@typescript-eslint/no-explicit-any: off'

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://bukleb.ru
        run: npm run build
