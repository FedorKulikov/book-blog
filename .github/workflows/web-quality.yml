  email-recovery-sql:
    name: Email recovery migration (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: recovery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create minimal Supabase Auth roles and schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname recovery_test --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY
          );

          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;

          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT CASE
              WHEN NULLIF(current_setting('request.jwt.claim.sub', true), '') IS NULL THEN 'anon'
              ELSE 'authenticated'
            END
          $function$;

          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets (
            id text PRIMARY KEY,
            public boolean NOT NULL DEFAULT true
          );
          CREATE TABLE storage.objects (
            id bigserial PRIMARY KEY,
            bucket_id text NOT NULL REFERENCES storage.buckets(id),
            name text NOT NULL
          );
          CREATE OR REPLACE FUNCTION storage.foldername(object_name text)
          RETURNS text[]
          LANGUAGE sql
          IMMUTABLE
          AS $function$
            SELECT string_to_array(object_name, '/')
          $function$;

          CREATE TABLE public.conversations (
            id uuid PRIMARY KEY,
            user1_id uuid NOT NULL,
            user2_id uuid NOT NULL
          );
          CREATE TABLE public.messages (
            id uuid PRIMARY KEY,
            conversation_id uuid NOT NULL REFERENCES public.conversations(id),
            sender_id uuid NOT NULL,
            image_url text,
            audio_url text
          );

          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.conversations ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.messages ENABLE ROW LEVEL SECURITY;

          CREATE POLICY chat_media_public_read
            ON storage.objects
            FOR SELECT
            TO public
            USING (bucket_id = 'chat-media');

          CREATE POLICY conversations_read_own
            ON public.conversations
            FOR SELECT
            TO authenticated
            USING (user1_id = auth.uid() OR user2_id = auth.uid());

          CREATE POLICY messages_read_own
            ON public.messages
            FOR SELECT
            TO authenticated
            USING (
              EXISTS (
                SELECT 1 FROM public.conversations c
                WHERE c.id = conversation_id
                  AND (c.user1_id = auth.uid() OR c.user2_id = auth.uid())
              )
            );

          GRANT USAGE ON SCHEMA auth, storage, public TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION storage.foldername(text) TO anon, authenticated;
          GRANT SELECT ON storage.buckets, storage.objects TO anon, authenticated;
          GRANT SELECT ON public.conversations, public.messages TO anon, authenticated;
          SQL

      - name: Apply email recovery migration to ephemeral PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname recovery_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261207_email_recovery_verification.sql

      - name: Verify grants, one-time tokens, and reset rate limits
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname recovery_test --set ON_ERROR_STOP=1 --file tests/sql/email-recovery-migration.test.sql

      - name: Seed chat media access fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname recovery_test --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO storage.buckets (id, public) VALUES ('chat-media', true);
          INSERT INTO public.conversations (id, user1_id, user2_id) VALUES
            ('10000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000002'),
            ('10000000-0000-0000-0000-000000000002', '00000000-0000-0000-0000-000000000003', '00000000-0000-0000-0000-000000000004'),
            ('10000000-0000-0000-0000-000000000003', '00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000005');
          INSERT INTO public.messages (id, conversation_id, sender_id, image_url, audio_url) VALUES
            ('20000000-0000-0000-0000-000000000001', '10000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000001', 'https://project.supabase.co/storage/v1/object/public/chat-media/00000000-0000-0000-0000-000000000001/photo.jpg', null),
            ('20000000-0000-0000-0000-000000000002', '10000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000001', null, '00000000-0000-0000-0000-000000000001/voice.webm'),
            ('20000000-0000-0000-0000-000000000003', '10000000-0000-0000-0000-000000000002', '00000000-0000-0000-0000-000000000003', 'https://project.supabase.co/storage/v1/object/public/chat-media/00000000-0000-0000-0000-000000000003/secret.jpg', null),
            ('20000000-0000-0000-0000-000000000004', '10000000-0000-0000-0000-000000000003', '00000000-0000-0000-0000-000000000001', 'https://project.supabase.co/storage/v1/object/public/chat-media/00000000-0000-0000-0000-000000000003/secret.jpg', null);
          INSERT INTO storage.objects (bucket_id, name) VALUES
            ('chat-media', '00000000-0000-0000-0000-000000000001/photo.jpg'),
            ('chat-media', '00000000-0000-0000-0000-000000000001/voice.webm'),
            ('chat-media', '00000000-0000-0000-0000-000000000003/secret.jpg');
          SQL

      - name: Apply private chat media migration to ephemeral PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname recovery_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261208_chat_media_private.sql

      - name: Verify private chat media access boundaries
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname recovery_test --set ON_ERROR_STOP=1 --file tests/sql/chat-media-private-migration.test.sql

  account-deletion-storage:
    name: Supabase Auth + Storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Prepare isolated local project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/account-deletion-supabase/supabase/migrations"
          cp tests/supabase/config.toml "$RUNNER_TEMP/account-deletion-supabase/supabase/config.toml"

      - name: Start local Supabase stack
        working-directory: ${{ runner.temp }}/account-deletion-supabase
        run: |
          supabase start --exclude studio,mailpit,logflare,vector,supavisor,edge-runtime,imgproxy,realtime,postgres-meta

      - name: Export local-only connection details
        working-directory: ${{ runner.temp }}/account-deletion-supabase
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/supabase-local.env"
          supabase status --output env > "$status_file"
          set -a
          # This is a CLI-generated local env file, not user-controlled input.
          # shellcheck disable=SC1090
          source "$status_file"
          set +a

          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Supabase API URL is not local"; exit 1 ;;
          esac
          case "$DB_URL" in
            *127.0.0.1:*|*localhost:*) ;;
            *) echo "::error::Supabase DB URL is not local"; exit 1 ;;
          esac

          # Supabase-managed storage.objects belongs to supabase_storage_admin.
          # The local supabase_admin DB role has the required administrative
          # rights; it shares the disposable local database password.
          admin_db_url="$(printf '%s' "$DB_URL" | sed -E 's#^(postgres(ql)?://)postgres:#\1supabase_admin:#')"
          case "$admin_db_url" in
            *127.0.0.1:*|*localhost:*) ;;
            *) echo "::error::Admin DB URL is not local"; exit 1 ;;
          esac
          admin_identity="$(psql "$admin_db_url" -X -A -t -v ON_ERROR_STOP=1 -c "select current_user || '|' || rolsuper::text from pg_roles where rolname = current_user")"
          if [ "$admin_identity" != "supabase_admin|true" ]; then
            echo "::error::Expected local supabase_admin superuser, got '$admin_identity'"
            exit 1
          fi

          for name in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing local Supabase variable: $name"
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          printf 'DB_URL=%s\n' "$admin_db_url" >> "$GITHUB_ENV"

      - name: Apply isolated account deletion fixtures
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f tests/supabase/account-deletion-storage-fixtures.sql

      - name: Test real Auth, Storage copy ownership, and participant RLS
        run: npm run test:account-deletion-storage

      - name: Stop and remove local Supabase containers
        if: always()
        working-directory: ${{ runner.temp }}/account-deletion-supabase
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi

  personal-data-consents-sql:
    name: Personal data consent migration (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: personal_data_consents_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_data_consents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create clean Supabase Auth roles and schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY
          );

          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;

          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT CASE
              WHEN NULLIF(current_setting('request.jwt.claim.sub', true), '') IS NULL THEN 'anon'
              ELSE 'authenticated'
            END
          $function$;

          GRANT USAGE ON SCHEMA auth, public TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.role() TO anon, authenticated, service_role;
          SQL

      - name: Apply migration to clean PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261209_personal_data_consents.sql

      - name: Reapply migration to verify idempotency
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261209_personal_data_consents.sql

      - name: Verify grants and consent record/revoke functions
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file tests/sql/personal-data-consents-migration.test.sql

      - name: Apply authenticated user-scoped consent RPC migration
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261210_distribution_consent_user_rpcs.sql

      - name: Reapply authenticated user-scoped consent RPC migration
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261210_distribution_consent_user_rpcs.sql

      - name: Verify authenticated user-scoped consent RPCs
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file tests/sql/personal-data-consents-user-rpcs.test.sql

      - name: Create posts fixture and apply publication-consent guard
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.posts (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL REFERENCES auth.users(id),
            title text NOT NULL,
            type text NOT NULL,
            status text NOT NULL DEFAULT 'approved',
            views_count integer NOT NULL DEFAULT 0,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          ALTER TABLE public.posts ENABLE ROW LEVEL SECURITY;
          GRANT SELECT, INSERT ON public.posts TO anon, authenticated;
          CREATE POLICY posts_read_approved_or_own ON public.posts
            FOR SELECT TO public
            USING (status = 'approved' OR user_id = auth.uid());
          CREATE POLICY posts_insert_own_test ON public.posts
            FOR INSERT TO authenticated
            WITH CHECK ((SELECT auth.uid()) = user_id);
          SQL
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261211_distribution_consent_post_guard.sql
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261211_distribution_consent_post_guard.sql

      - name: Verify post creation requires user consent
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 --file tests/sql/distribution-consent-publication-guard.test.sql

      - name: Create profile and Storage fixtures, apply profile-consent guard
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname personal_data_consents_test --set ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY REFERENCES auth.users(id),
            username text NOT NULL,
            bio text,
            avatar_url text,
            created_at timestamptz DEFAULT now(),
            role text DEFAULT 'user',
            is_banned boolean DEFAULT false,
            banned_until timestamptz,
            onboarding_completed_at timestamptz,
            notifications_muted boolean DEFAULT false
          );
          ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
          CREATE POLICY profiles_read_all ON public.profiles
            FOR SELECT TO public USING (true);

          CREATE TABLE public.conversations (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user1_id uuid NOT NULL,
