name: Test email Hook

# Проверка Next.js email Hook endpoint, событий Auth, регистрации и входа.
# Тестовые пользователи удаляются в конце прогона.
#
# Запуск: Actions → Test email Hook → Run workflow.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/test-email-hook.ts'
      - '.github/workflows/test-email-hook.yml'
      - 'app/api/auth/email-hook/**'
      - 'lib/supabase/admin.ts'
      - 'app/signup/page.tsx'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'app/auth/confirm/**'
      - 'app/welcome/**'
      - 'app/auth/reset/page.tsx'
      - 'lib/errors.ts'
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://bukleb.ru

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Секрет хука генерируется только для локального тестового Next.js server.
      - name: Сгенерировать секрет тестового Hook
        run: |
          {
            echo "AUTH_EMAIL_HOOK_SECRET=v1,whsec_$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      - name: Сборка
        run: npm run build

      - name: Поднять сервер
        run: |
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/login; then
              echo "сервер поднялся"
              exit 0
            fi
            sleep 1
          done
          echo "::error::сервер не поднялся"
          tail -80 /tmp/next.log
          exit 1


      - name: Email Hook scenarios
        run: npx tsx scripts/test-email-hook.ts

      - name: Лог сервера
        if: always()
        run: tail -120 /tmp/next.log
