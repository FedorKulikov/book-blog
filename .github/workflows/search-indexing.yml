name: Search indexing notification

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.ts'
      - '.github/workflows/search-indexing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-indexing
  cancel-in-progress: true

jobs:
  notify:
    name: Notify IndexNow-compatible search engines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site key
        uses: actions/checkout@v4

      - name: Notify search engines about public landing pages
        shell: bash
        run: |
          set -euo pipefail

          KEY='7846d99d4d624f7699036567738094ae'
          KEY_FILE="public/${KEY}.txt"
          KEY_URL="https://bukleb.ru/${KEY}.txt"

          # A green IndexNow run must mean the expected SEO release is actually live.
          homepage="$(mktemp)"
          homepage_status="$(curl --silent --show-error --location --max-time 20 \
            --output "${homepage}" --write-out '%{http_code}' 'https://bukleb.ru/' || true)"
          if [[ "${homepage_status}" != "200" ]] || ! grep -Fq 'Книжное сообщество для читателей' "${homepage}"; then
            rm -f "${homepage}"
            echo "::error::bukleb.ru is not serving the SEO release yet. Promote the latest ready main deploy in Layero."
            exit 1
          fi
          rm -f "${homepage}"

          sitemap="$(mktemp)"
          sitemap_status="$(curl --silent --show-error --location --max-time 20 \
            --output "${sitemap}" --write-out '%{http_code}' 'https://bukleb.ru/sitemap.xml' || true)"
          if [[ "${sitemap_status}" != "200" ]] || ! grep -Fq 'https://bukleb.ru/' "${sitemap}"; then
            rm -f "${sitemap}"
            echo "::error::The production sitemap is unavailable or does not contain the canonical domain."
            exit 1
          fi
          rm -f "${sitemap}"

          if [[ ! -f "${KEY_FILE}" ]] || [[ "$(tr -d '\r\n' < "${KEY_FILE}")" != "${KEY}" ]]; then
            echo "::error::IndexNow key file is missing or does not match the configured key."
            exit 1
          fi

          verified=0
          for attempt in {1..12}; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 15 \
              --output "${body}" --write-out '%{http_code}' "${KEY_URL}" || true)"
            if [[ "${status}" == "200" ]] && [[ "$(tr -d '\r\n' < "${body}")" == "${KEY}" ]]; then
              verified=1
              rm -f "${body}"
              break
            fi
            rm -f "${body}"
            echo "Public key file not ready yet (attempt ${attempt}/12, HTTP ${status:-unknown})."
            sleep 15
          done

          if [[ "${verified}" -ne 1 ]]; then
            echo "::error::The live IndexNow key file is still unavailable after 12 attempts. No URLs were submitted."
            exit 1
          fi

          urls='[
            "https://bukleb.ru/",
            "https://bukleb.ru/books",
            "https://bukleb.ru/posts",
            "https://bukleb.ru/news",
            "https://bukleb.ru/creative",
            "https://bukleb.ru/discussions"
          ]'

          payload="$(jq -n \
            --arg host "bukleb.ru" \
            --arg key "${KEY}" \
            --arg keyLocation "${KEY_URL}" \
            --argjson urlList "${urls}" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary "${payload}" \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            'https://api.indexnow.org/indexnow' || true)"

          case "${status}" in
            200|202)
              echo "IndexNow accepted the public landing-page URLs (HTTP ${status})."
              ;;
            *)
              echo "::error::IndexNow did not accept the submission (HTTP ${status:-unknown}). Response omitted from logs."
              rm -f "${response_file}"
              exit 1
              ;;
          esac

          rm -f "${response_file}"
