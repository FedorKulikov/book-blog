name: Production health smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/production-health-smoke.yml'
      - 'scripts/check-production-analytics-consent.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: production-health-smoke
  cancel-in-progress: true

jobs:
  check-production:
    name: Check ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Custom domain bukleb.ru
            url: https://bukleb.ru
          - label: Layero project domain
            url: https://book-blog.layero.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and verify the live application
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          SITE_LABEL: ${{ matrix.label }}
          SITE_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/site.html"
          headers="$RUNNER_TEMP/headers.txt"

          status="$(curl --silent --show-error --location \
            --retry 2 --retry-delay 4 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            --user-agent 'BookBlogProductionHealth/1.0' \
            --dump-header "$headers" --output "$body" \
            --write-out '%{http_code}' "$SITE_URL")"

          title="$(grep -io '<title>[^<]*</title>' "$body" | head -n 1 || true)"
          echo "Endpoint: $SITE_LABEL"
          echo "HTTP status: $status"
          echo "Page title: ${title:-<missing>}"

          {
            echo "### $SITE_LABEL"
            echo ""
            echo "- URL: $SITE_URL"
            echo "- HTTP: $status"
            echo "- Title: ${title:-missing}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200 from $SITE_URL, received $status"
            exit 1
          fi

          if ! grep -Fq 'Хлеба и букв' "$body"; then
            echo "::error::The response does not contain the expected Book Blog application marker."
            exit 1
          fi

          if ! grep -Fq 'Книжное сообщество для читателей' "$body"; then
            echo "::error::The response is serving the app but not the current SEO homepage metadata."
            exit 1
          fi

          echo "Production application marker and SEO homepage metadata verified."


          if [[ "$SITE_URL" == "https://bukleb.ru" ]]; then
            privacy_body="$RUNNER_TEMP/privacy.html"
            privacy_status="$(curl --silent --show-error --location --retry 2 --retry-delay 4 --retry-all-errors --max-time 45 --output "$privacy_body" --write-out '%{http_code}' "${SITE_URL%/}/privacy")"
            if [[ "$privacy_status" != "200" ]]; then
              echo "::error::Production /privacy must return HTTP 200 (received $privacy_status)."
              exit 1
            fi
            if ! grep -Fq 'Редакция 1.1 от 23 ноября 2026 года' "$privacy_body"; then
              echo "::error::Production /privacy does not contain the expected 1.1 edition marker."
              exit 1
            fi
            if grep -Eiq 'резервн(ый|ые|ого|ых)[[:space:]]+код' "$privacy_body"; then
              echo "::error::Production /privacy still mentions retired recovery codes."
              exit 1
            fi
            echo "Production /privacy returns HTTP 200, is edition 1.1, and has no retired recovery-code references."
          fi

          check_guest_login_redirect() {
            local route="$1"
            local expected_next="$2"
            local headers="$RUNNER_TEMP/guest-${route//\//_}.headers"
            local request_url="${SITE_URL%/}${route}"
            local status location
            status="$(curl --silent --show-error --max-time 25 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$request_url" || true)"
            location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit }' "$headers")"

            # Layero's project alias canonically redirects to the custom domain.
            # Follow only that known 301 manually so the final login redirect can
            # be inspected without automatically following it to the login page.
            if [[ "$status" == "301" && "$location" == "https://bukleb.ru${route}" ]]; then
              request_url="$location"
              status="$(curl --silent --show-error --max-time 25 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$request_url" || true)"
              location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit }' "$headers")"
            fi

            if [[ ! "$status" =~ ^30[1278]$ ]] || [[ "$location" != *"/login?next="* ]] || [[ "$location" != *"$expected_next"* ]]; then
              echo "::error::Guest route $route must redirect to /login with its return path (HTTP $status; Location: $location)."
              exit 1
            fi
            echo "Guest route $route redirects to login and preserves its return path."
          }

          check_guest_login_redirect "/profile" "%2Fprofile"
          check_guest_login_redirect "/messages" "%2Fmessages"
          check_guest_login_redirect "/messages/00000000-0000-0000-0000-000000000000" "%2Fmessages%2F00000000-0000-0000-0000-000000000000"
          check_guest_login_redirect "/profile/edit" "%2Fprofile%2Fedit"
          check_guest_login_redirect "/books/add" "%2Fbooks%2Fadd"
          check_guest_login_redirect "/news/new" "%2Fnews%2Fnew"
          check_guest_login_redirect "/welcome" "%2Fwelcome"

          for public_route in "/login" "/signup" "/forgot-password" "/support"; do
            public_status="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' "${SITE_URL%/}${public_route}" || true)"
            if [[ "$public_status" != "200" ]]; then
              echo "::error::Public guest route $public_route must return HTTP 200 (received $public_status)."
              exit 1
            fi
            echo "Public guest route $public_route is reachable."
          done

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            retired_route_status="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' "${SITE_URL%/}/recover-account" || true)"
            if [[ "$retired_route_status" != "404" ]]; then
              echo "::error::Retired /recover-account route must return HTTP 404 (received $retired_route_status)."
              exit 1
            fi
            echo "Retired /recover-account route returns HTTP 404."
          else
            echo "Skip /recover-account production 404 check on PR: production still serves main."
          fi

          filter_headers="$RUNNER_TEMP/news-filter-headers.txt"
          filter_status="$(curl --silent --show-error --location --max-time 25 --dump-header "$filter_headers" --output /dev/null --write-out '%{http_code}' "${SITE_URL%/}/news?category=contest" || true)"
          if [[ "$filter_status" != "200" ]] || ! grep -Eiq '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*follow' "$filter_headers"; then
            echo "::error::A filtered news category must return HTTP 200 with X-Robots-Tag: noindex, follow (received HTTP $filter_status)."
            exit 1
          fi
          echo "Filtered news category is noindex,follow."

          news_headers="$RUNNER_TEMP/news-main-headers.txt"
          news_status="$(curl --silent --show-error --location --max-time 25 --dump-header "$news_headers" --output /dev/null --write-out '%{http_code}' "${SITE_URL%/}/news" || true)"
          if [[ "$news_status" != "200" ]] || grep -Eiq '^x-robots-tag:.*noindex' "$news_headers"; then
            echo "::error::The main /news landing page must remain indexable (received HTTP $news_status)."
            exit 1
          fi
          echo "Main /news landing page remains indexable."

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "Skip /rules production check on PR: the production domain is still serving main. The route check runs after merge on the main push."
          else
            rules_status="$(curl --silent --show-error --location --max-time 25 --output "$RUNNER_TEMP/rules.html" --write-out '%{http_code}' "${SITE_URL%/}/rules" || true)"
            if [[ "$rules_status" != "200" ]] || ! grep -Fq 'Правила сообщества' "$RUNNER_TEMP/rules.html"; then
              echo "::error::The community rules page must return HTTP 200 and contain its expected heading (received HTTP $rules_status)."
              exit 1
            fi
            echo "Public community rules page is reachable."
          fi

      - name: Verify analytics consent persistence in Chromium
        if: github.event_name != 'pull_request' && matrix.label == 'Custom domain bukleb.ru'
        shell: bash
        env:
          SITE_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_BIN" ]]; then
            echo "::error::A Chromium-compatible browser is required for the production analytics-consent check."
            exit 1
          fi
          CHROME_BIN="$CHROME_BIN" node scripts/check-production-analytics-consent.mjs "$SITE_URL"
