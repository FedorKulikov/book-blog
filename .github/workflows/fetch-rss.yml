name: Fetch RSS news

on:
  schedule:
    # Каждый день в 03:00 UTC = 06:00 по Москве и в 15:00 UTC = 18:00 МСК:
    # радар должен обновляться и вечером, а не только ночью
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  # Оставляем ручной запуск: кнопка Run workflow в Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-rss-news
  cancel-in-progress: false

jobs:
  fetch:
    name: RSS → external_news
    runs-on: ubuntu-24.04
    # Импорт + догонка обложек (до ~50 страниц с таймаутом 3 с) укладываются
    # в пару минут, но запас на медленные сайты держим
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 не имеет нативного WebSocket, который нужен @supabase/supabase-js
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and store RSS news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Источники заданы в скрипте («Литературная карта» и Эксмо).
          # Свой список можно передать через переменную репозитория RSS_FEED_URLS.
          RSS_FEED_URLS: ${{ vars.RSS_FEED_URLS }}
        run: npx tsx scripts/fetch-rss-news.ts
