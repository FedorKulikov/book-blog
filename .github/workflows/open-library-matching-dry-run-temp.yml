name: Temporary Open Library author/title dry-run

on:
  push:
    branches:
      - fix/openlibrary-author-title-matching-2026-11-24

permissions:
  contents: read

concurrency:
  group: open-library-author-title-dry-run
  cancel-in-progress: false

jobs:
  preview:
    name: Read-only Open Library matching preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run read-only Open Library dry-run
        env:
          SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/enrich-book-descriptions.ts
