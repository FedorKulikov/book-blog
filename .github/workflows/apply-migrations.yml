name: Apply DB migrations

# Автоматическое применение новых SQL-миграций после merge в main.
# Также сохраняется ручной workflow_dispatch для точечного/полного запуска.
#
# На push применяется только хвост файлов, идущий после последней записи
# ops.applied_migrations. Это не переигрывает старые миграции, которые могли
# быть применены до появления реестра. Новые миграции добавляются в конец
# последовательности и должны быть идемпотентными.
#
# DDL выполняется через SUPABASE_DB_URL (секрет); пароль не печатается.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/apply-migrations.yml'
  workflow_dispatch:
    inputs:
      files:
        description: 'Файлы миграций через пробел или ALL — все из supabase/migrations'
        required: false
        default: 'ALL'

permissions:
  contents: read

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: psql → supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure psql
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
            psql --version
          fi

      - name: Apply migrations
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FILES: ${{ github.event.inputs.files || '' }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::секрет SUPABASE_DB_URL не задан"
            exit 1
          fi

          # Реестр применённых миграций: создаётся здесь же, чтобы первый
          # запуск на чистой базе не падал.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            create schema if not exists ops;
            create table if not exists ops.applied_migrations (
              filename   text primary key,
              checksum   text,
              applied_at timestamptz not null default now(),
              applied_by text default current_user
            );
          "

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Используем high-water mark из реестра. Это намеренно не
            # backfill-ит старые файлы, если у них нет исторической записи.
            last_applied="$(
              psql "$DB_URL" -v ON_ERROR_STOP=1 -tA \
                -c "select coalesce(max(filename), '') from ops.applied_migrations"
            )"
            FILES="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)"
            if [[ -n "$last_applied" ]]; then
              FILES="$(printf '%s\n' "$FILES" | LC_ALL=C awk -v last="$last_applied" 'length($0) && $0 > last')"
            fi
            if [[ -z "$FILES" ]]; then
              echo "No new migration files after $last_applied"
              exit 0
            fi
          elif [[ -z "${FILES:-}" || "$FILES" == "ALL" ]]; then
            FILES="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)"
          fi

          applied=0
          skipped=0

          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "::error::нет файла $f"
              exit 1
            fi

            sum=$(sha256sum "$f" | cut -d' ' -f1)
            prev=$(psql "$DB_URL" -tA -c "select checksum from ops.applied_migrations where filename = '$f'")

            if [ -n "$prev" ]; then
              if [ "$prev" = "$sum" ]; then
                echo "пропускаю $f — уже применена"
                skipped=$((skipped + 1))
                continue
              fi
              echo "::warning::$f уже применена, но файл изменился — применяю повторно"
            fi

            echo "::group::применяю $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
              insert into ops.applied_migrations (filename, checksum)
              values ('$f', '$sum')
              on conflict (filename) do update
                set checksum = excluded.checksum, applied_at = now();
            "
            echo "::endgroup::"
            applied=$((applied + 1))
          done

          echo "### Миграции: применено $applied, пропущено $skipped" >> $GITHUB_STEP_SUMMARY

      - name: История миграций
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -c "
            select filename, left(checksum, 12) as checksum, applied_at::timestamp(0), applied_by
            from ops.applied_migrations
            order by filename;
          "

      - name: Verify schema
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FILES: ${{ github.event.inputs.files || '' }}
        run: |
          set -euo pipefail
          echo "::group::колонки external_news"
          psql "$DB_URL" -c "
            select column_name, data_type, is_nullable
            from information_schema.columns
            where table_schema = 'public' and table_name = 'external_news'
            order by ordinal_position;
          "
          echo "::endgroup::"

          echo "::group::распределение по рубрикам и языкам"
          psql "$DB_URL" -c "
            select news_category, lang, count(*)
            from public.external_news
            group by 1, 2
            order by 3 desc;
          "
          echo "::endgroup::"

          echo "::group::тренды"
          psql "$DB_URL" -c "
            select topic, kind, mentions
            from public.news_trends
            order by mentions desc
            limit 10;
          " || echo "таблица news_trends пока пуста — заполнится при импорте"
          echo "::endgroup::"
