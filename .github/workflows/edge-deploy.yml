name: Edge deploy (temporary)

on:
  push:
    branches:
      - ops/supabase-edge-deploy
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/edge-deploy.yml'
      - 'scripts/test-recovery.ts'
      - 'scripts/test-email-hook.ts'
      - 'scripts/verify-edge-hook-secret.ts'

permissions:
  contents: read

concurrency:
  group: edge-deploy-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REF: tbqjyaxbymntdqzldrjz
      BASE: https://tbqjyaxbymntdqzldrjz.supabase.co/functions/v1

    steps:
      - name: Проверить секреты (только признаки наличия)
        env:
          PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          HOOK: ${{ secrets.AUTH_EMAIL_HOOK_SECRET }}
        run: |
          set +x
          set -euo pipefail
          missing=0
          check() { if [ -z "$2" ]; then echo "missing_secret: $1"; missing=1; fi; }
          check SUPABASE_ACCESS_TOKEN "$PAT"
          check SUPABASE_SECRET_KEY "$SECRET_KEY"
          check SUPABASE_PUBLISHABLE_KEY "$PUBLISHABLE"
          check AUTH_EMAIL_HOOK_SECRET "$HOOK"
          if [[ -n "$HOOK" && ! "$HOOK" =~ ^v1,whsec_[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "invalid_secret_format: AUTH_EMAIL_HOOK_SECRET must be v1,whsec_ followed by base64"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "остановка до операций записи"
            exit 1
          fi
          decoded_bytes="$(printf '%s' "${HOOK#v1,whsec_}" | base64 --decode | wc -c)"
          if [[ "$decoded_bytes" -ne 32 ]]; then
            echo "invalid_secret_length: AUTH_EMAIL_HOOK_SECRET must decode to exactly 32 bytes"
            exit 1
          fi
          echo "secrets: ok"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Установить зависимости
        run: npm ci

      - name: Read-only preflight: existing Function Secrets and stable Hook signature
        env:
          PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HOOK: ${{ secrets.AUTH_EMAIL_HOOK_SECRET }}
        run: |
          set +x
          set -euo pipefail
          # Keep the provider's secret list only in memory; never print it.
          secret_names="$(SUPABASE_ACCESS_TOKEN="$PAT" npx --yes supabase@3.2.0 secrets list --project-ref="$REF" 2>/dev/null)" || {
            echo "function_secret_inventory_failed"
            exit 1
          }
          for name in AUTH_EMAIL_HOOK_SECRET RESEND_API_KEY; do
            if ! grep -Fq "$name" <<< "$secret_names"; then
              echo "missing_function_secret: $name"
              exit 1
            fi
          done
          unset secret_names
          export EDGE_FUNCTIONS_URL="$BASE"
          export AUTH_EMAIL_HOOK_SECRET="$HOOK"
          npx --yes tsx scripts/verify-edge-hook-secret.ts

      - name: Deploy трёх функций
        env:
          PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +x
          SUPABASE_ACCESS_TOKEN="$PAT" \
            npx --yes supabase@3.2.0 functions deploy recovery \
            --remote="$REF" --use-api --yes
          SUPABASE_ACCESS_TOKEN="$PAT" \
            npx --yes supabase@3.2.0 functions deploy auth-email-hook \
            --remote="$REF" --use-api --yes
          SUPABASE_ACCESS_TOKEN="$PAT" \
            npx --yes supabase@3.2.0 functions deploy resend-mailer \
            --remote="$REF" --use-api --yes

      - name: Function Secrets и проверка Email Hook
        env:
          PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          HOOK: ${{ secrets.AUTH_EMAIL_HOOK_SECRET }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          hook="$HOOK"
          echo "::add-mask::$hook"

          tmp=$(mktemp)
          trap 'shred -u "$tmp" 2>/dev/null || rm -f "$tmp"' EXIT
          {
            printf 'AUTH_EMAIL_HOOK_SECRET=%s\n' "$hook"
          } > "$tmp"

          SUPABASE_ACCESS_TOKEN="$PAT" \
            npx --yes supabase@3.2.0 secrets set \
            --env-file "$tmp" --remote="$REF" --yes

          timeout_opts="--connect-timeout 10 --max-time 30"

          status=$(curl -sS $timeout_opts -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "$BASE/recovery?op=status")
          echo "recovery_status_post_http: $status"
          [ "$status" = "401" ] || { echo "ожидали 401"; exit 1; }

          unsigned=$(curl -sS $timeout_opts -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "$BASE/auth-email-hook")
          echo "hook_unsigned_http: $unsigned"
          [ "$unsigned" = "401" ] || { echo "ожидали 401"; exit 1; }

          mailer_unsigned=$(curl -sS $timeout_opts -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "$BASE/resend-mailer")
          echo "mailer_unsigned_http: $mailer_unsigned"
          [ "$mailer_unsigned" = "401" ] || { echo "ожидали 401"; exit 1; }

          export EDGE_FUNCTIONS_URL="$BASE"
          export NEXT_PUBLIC_SUPABASE_URL="https://${REF}.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUBLISHABLE"
          export SUPABASE_SECRET_KEY="$SECRET_KEY"
          export AUTH_EMAIL_HOOK_SECRET="$hook"

          npx --yes tsx scripts/test-email-hook.ts

      - name: Интеграционные сценарии Recovery
        env:
          SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set +x
          export EDGE_FUNCTIONS_URL="$BASE"
          export SUPABASE_URL="https://${REF}.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUBLISHABLE"
          export SUPABASE_SECRET_KEY="$SECRET_KEY"

          npx --yes tsx scripts/test-recovery.ts