name: Guest UX audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  guest-ux-audit:
    name: Audit public guest pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install temporary Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ux-audit"
          cd "$RUNNER_TEMP/ux-audit"
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.51.1

      - name: Run guest UX audit
        shell: bash
        env:
          SITE_URL: https://bukleb.ru
        run: |
          set -euo pipefail

          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_BIN" ]]; then
            echo "::error::No system Chromium binary found on the GitHub runner."
            exit 1
          fi

          export SCREENSHOT_DIR="$GITHUB_WORKSPACE/ux-audit-screenshots"
          mkdir -p "$SCREENSHOT_DIR"

          cat > "$RUNNER_TEMP/ux-audit/ux-audit.mjs" <<'NODE'
          import { chromium, request } from 'playwright';

          const SITE_URL = new URL(process.env.SITE_URL).origin;
          const SCREENSHOT_DIR = process.env.SCREENSHOT_DIR;
          const CHROME_BIN = process.env.CHROME_BIN;

          const pages = [
            { name: 'Главная', slug: 'home', path: '/' },
            { name: 'Книги', slug: 'books', path: '/books' },
            { name: 'Новости', slug: 'news', path: '/news' },
            { name: 'Публикации', slug: 'posts', path: '/posts' },
            { name: 'Творчество', slug: 'creative', path: '/creative' },
            { name: 'Обсуждения', slug: 'discussions', path: '/discussions' },
            { name: 'Правила', slug: 'rules', path: '/rules' },
            { name: 'Политика конфиденциальности', slug: 'privacy', path: '/privacy' },
            { name: 'Поддержка', slug: 'support', path: '/support' },
            { name: 'Регистрация', slug: 'signup', path: '/signup' },
            { name: 'Публикация из sitemap.xml', slug: 'sitemap-post', pattern: /^\/post\/[^/]+\/?$/i },
            { name: 'Книга из sitemap.xml', slug: 'sitemap-book', pattern: /^\/book\/[^/]+\/?$/i },
            { name: 'Профиль из sitemap.xml', slug: 'sitemap-profile', pattern: /^\/profile\/[^/]+\/?$/i },
          ];

          const viewports = [
            { name: 'desktop', width: 1440, height: 900 },
            { name: 'mobile', width: 390, height: 844 },
          ];

          const emptyStatePattern = /пока\s+(?:ничего|нет)|ничего\s+(?:не\s+найдено|нет)|не\s+найдено|нет\s+(?:публикаций|постов|книг|обсуждений|сообщений|комментариев|результатов)|здесь\s+пока|no\s+(?:posts|books|results|comments|messages)|nothing\s+to\s+show/i;

          function decodeXml(value) {
            return value
              .replace(/&amp;/g, '&')
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'");
          }

          async function readSitemap() {
            const client = await request.newContext({
              timeout: 30000,
              userAgent: 'BookBlogGuestUXAudit/1.0',
            });

            try {
              const sitemapUrl = SITE_URL + '/sitemap.xml';
              const response = await client.get(sitemapUrl);
              console.log('\n================ SITEMAP ================');
              console.log('HTTP status: ' + response.status());
              console.log('Final URL: ' + response.url());

              if (!response.ok()) {
                console.log('Sitemap не открылся; три динамические страницы останутся без URL.');
                return [];
              }

              const xml = await response.text();
              return [...xml.matchAll(/<loc>\s*([\s\S]*?)\s*<\/loc>/gi)]
                .map((match) => decodeXml(match[1].trim()))
                .map((value) => {
                  try { return new URL(value, SITE_URL); } catch { return null; }
                })
                .filter((url) => url && url.origin === SITE_URL);
            } catch (error) {
              console.log('Sitemap не открылся: ' + (error?.message || String(error)));
              return [];
            } finally {
              await client.dispose();
            }
          }

          const sitemapUrls = await readSitemap();
          for (const entry of pages) {
            if (entry.pattern) {
              const match = sitemapUrls.find((url) => entry.pattern.test(url.pathname));
              entry.url = match ? match.href : null;
              if (!entry.url) {
                console.log('[SITEMAP] Не найден URL для страницы: ' + entry.name);
              }
            } else {
              entry.url = new URL(entry.path, SITE_URL).href;
            }
          }

          let browser;
          let openedCount = 0;
          let failedOpenCount = 0;

          try {
            browser = await chromium.launch({
              headless: true,
              executablePath: CHROME_BIN,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            const context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              locale: 'ru-RU',
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            page.setDefaultNavigationTimeout(30000);
            page.setDefaultTimeout(10000);

            for (let index = 0; index < pages.length; index += 1) {
              const entry = pages[index];
              console.log('\n' + '='.repeat(88));
              console.log('СТРАНИЦА ' + (index + 1) + '/' + pages.length + ': ' + entry.name);
              console.log('Запрошенный URL: ' + (entry.url || '<не найден в sitemap.xml>'));

              if (!entry.url) {
                console.log('НЕ ОТКРЫЛАСЬ: URL страницы не найден в sitemap.xml.');
                failedOpenCount += 1;
                continue;
              }

              const consoleErrors = [];
              const pageErrors = [];
              const navigationResponses = [];

              const onConsole = (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              };
              const onPageError = (error) => pageErrors.push(error.message || String(error));
              const onResponse = (response) => {
                const request = response.request();
                if (!request.isNavigationRequest()) return;
                try {
                  if (request.frame() === page.mainFrame()) {
                    navigationResponses.push({ status: response.status(), url: response.url() });
                  }
                } catch {
                  // Ignore detached-frame navigation events.
                }
              };

              page.on('console', onConsole);
              page.on('pageerror', onPageError);
              page.on('response', onResponse);

              let response = null;
              let openError = null;
              await page.setViewportSize({ width: 1440, height: 900 });

              try {
                response = await page.goto(entry.url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(700);
              } catch (error) {
                openError = error?.message || String(error);
              }

              if (openError) {
                console.log('НЕ ОТКРЫЛАСЬ: ' + openError);
                if (navigationResponses.length) {
                  console.log('Ответы навигации: ' + navigationResponses.map((item) => item.status + ' ' + item.url).join(' -> '));
                }
                failedOpenCount += 1;
                page.off('console', onConsole);
                page.off('pageerror', onPageError);
                page.off('response', onResponse);
                continue;
              }

              openedCount += 1;
              console.log('HTTP-статус итогового ответа: ' + (response ? response.status() : '<ответ не получен>'));
              console.log('Итоговый URL после редиректов: ' + page.url());
              if (navigationResponses.length) {
                console.log('Цепочка навигации: ' + navigationResponses.map((item) => item.status + ' ' + item.url).join(' -> '));
              }

              const details = await page.evaluate((emptyPatternSource) => {
                const bodyText = document.body?.innerText || '';
                const emptyPattern = new RegExp(emptyPatternSource, 'i');
                const emptyStates = [...new Set(
                  bodyText.split(/\r?\n/)
                    .map((line) => line.trim().replace(/\s+/g, ' '))
                    .filter((line) => line && emptyPattern.test(line))
                    .map((line) => line.slice(0, 240))
                )];

                function countLinks(prefix) {
                  return Array.from(document.querySelectorAll('a[href]')).filter((anchor) => {
                    try {
                      return new URL(anchor.href, location.href).pathname.startsWith(prefix);
                    } catch {
                      return false;
                    }
                  }).length;
                }

                return {
                  title: document.title || '',
                  visibleText: bodyText.slice(0, 1500),
                  links: {
                    post: countLinks('/post/'),
                    book: countLinks('/book/'),
                    profile: countLinks('/profile/'),
                  },
                  emptyStates,
                };
              }, emptyStatePattern.source);

              console.log('Title: ' + (details.title || '<пусто>'));
              console.log('Видимый текст (первые 1500 символов):');
              console.log(details.visibleText || '<пусто>');
              console.log('Ссылки: /post/=' + details.links.post + ', /book/=' + details.links.book + ', /profile/=' + details.links.profile);
              console.log('Пустые состояния: ' + (details.emptyStates.length ? details.emptyStates.join(' | ') : '<совпадений не найдено>'));

              if (entry.slug === 'signup') {
                const registration = await page.evaluate(() => {
                  const forms = Array.from(document.querySelectorAll('form'))
                    .filter((form) => form.getClientRects().length > 0)
                    .map((form) => ({
                      fields: Array.from(form.querySelectorAll('input:not([type="hidden"]), select, textarea'))
                        .filter((field) => field.getClientRects().length > 0)
                        .map((field) => {
                          const tag = field.tagName.toLowerCase();
                          const labels = field.labels
                            ? Array.from(field.labels).map((label) => label.innerText.trim()).filter(Boolean)
                            : [];
                          return {
                            tag,
                            type: field.getAttribute('type') || tag,
                            name: field.getAttribute('name') || '',
                            label: labels.join(' / ') || field.getAttribute('aria-label') || '',
                            placeholder: field.getAttribute('placeholder') || '',
                            required: field.hasAttribute('required'),
                          };
                        }),
                      submitControls: Array.from(form.querySelectorAll('button[type="submit"], input[type="submit"]'))
                        .filter((control) => control.getClientRects().length > 0)
                        .map((control) => (control.innerText || control.getAttribute('value') || '').trim()),
                    }));

                  const documentLinks = Array.from(document.querySelectorAll('a[href]'))
                    .filter((anchor) => {
                      try {
                        const pathname = new URL(anchor.href, location.href).pathname;
                        return pathname === '/rules' || pathname === '/privacy';
                      } catch {
                        return false;
                      }
                    })
                    .map((anchor) => ({
                      text: (anchor.innerText || '').trim(),
                      url: anchor.href,
                    }));

                  return { forms, documentLinks };
                });

                console.log('ПРОВЕРКА ФОРМЫ РЕГИСТРАЦИИ (только чтение DOM; отправки не было):');
                console.log('Видимых форм: ' + registration.forms.length);
                registration.forms.forEach((form, formIndex) => {
                  console.log('Форма ' + (formIndex + 1) + ':');
                  console.log('Поля: ' + (form.fields.length
                    ? form.fields.map((field) => [
                        field.tag,
                        'type=' + field.type,
                        'name=' + (field.name || '<нет>'),
                        'label=' + (field.label || '<нет>'),
                        'placeholder=' + (field.placeholder || '<нет>'),
                        'required=' + field.required,
                      ].join(', ')).join(' | ')
                    : '<видимых полей нет>'));
                  console.log('Кнопки отправки (не нажимались): ' + (form.submitControls.join(' | ') || '<не найдены>'));
                });
                console.log('Ссылки на документы: ' + (registration.documentLinks.length
                  ? registration.documentLinks.map((link) => (link.text || '<без текста>') + ' -> ' + link.url).join(' | ')
                  : '<не найдены>'));
              }

              for (const viewport of viewports) {
                await page.setViewportSize({ width: viewport.width, height: viewport.height });
                await page.waitForTimeout(250);
                const filename = String(index + 1).padStart(2, '0') + '-' + entry.slug + '-' +
                  viewport.width + 'x' + viewport.height + '.png';
                const outputPath = SCREENSHOT_DIR + '/' + filename;

                try {
                  await page.screenshot({
                    path: outputPath,
                    fullPage: true,
                    animations: 'disabled',
                    timeout: 45000,
                  });
                  console.log('Скриншот сохранён: ' + filename);
                } catch (error) {
                  console.log('СКРИНШОТ НЕ СОХРАНЁН (' + viewport.width + 'x' + viewport.height + '): ' +
                    (error?.message || String(error)));
                }
              }

              console.log('Ошибки console.error: ' + consoleErrors.length);
              consoleErrors.forEach((message) => console.log('  console.error: ' + message));
              console.log('Ошибки pageerror: ' + pageErrors.length);
              pageErrors.forEach((message) => console.log('  pageerror: ' + message));

              page.off('console', onConsole);
              page.off('pageerror', onPageError);
              page.off('response', onResponse);
            }

            await context.close();
          } finally {
            if (browser) await browser.close();
          }

          console.log('\n================ ИТОГ UX AUDIT ================');
          console.log('Открыто страниц: ' + openedCount + '/' + pages.length);
          console.log('Не открыто: ' + failedOpenCount);
          console.log('Каталог скриншотов: ' + SCREENSHOT_DIR);
          NODE

          node "$RUNNER_TEMP/ux-audit/ux-audit.mjs"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-screenshots
          path: ux-audit-screenshots/
          if-no-files-found: warn
          retention-days: 7
