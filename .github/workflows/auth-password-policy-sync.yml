name: Sync Supabase Auth password minimum

on:
  push:
    branches:
      - main
    paths:
      - 'app/signup/page.tsx'
      - 'app/auth/reset/page.tsx'
      - 'app/recover-account/page.tsx'
      - 'app/api/recovery/redeem/route.ts'
      - 'lib/recovery.ts'
      - 'lib/errors.ts'
      - '.github/workflows/auth-password-policy-sync.yml'

permissions:
  contents: read

concurrency:
  group: auth-password-policy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce and verify minimum password length
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: tbqjyaxbymntdqzldrjz
        run: |
          set -euo pipefail
          set +x

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT

          get_config() {
            curl -sS --connect-timeout 10 --max-time 30 \
              -o "$1" -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          }

          status=$(get_config "$dir/current.json")
          if [ "$status" != "200" ]; then
            echo "::error::Auth config read failed (HTTP $status); config was not changed"
            exit 1
          fi

          current=$(jq -r '.password_min_length // empty' "$dir/current.json")
          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            echo "::error::Auth password_min_length is missing or invalid; config was not changed"
            exit 1
          fi

          if [ "$current" -lt 8 ]; then
            printf '%s\n' '{"password_min_length":8}' > "$dir/patch.json"
            status=$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$dir/patch-response.json" -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$dir/patch.json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth")
            if [ "$status" != "200" ]; then
              echo "::error::Auth password policy update failed (HTTP $status)"
              exit 1
            fi
          fi

          status=$(get_config "$dir/verified.json")
          if [ "$status" != "200" ]; then
            echo "::error::Auth config verification failed (HTTP $status)"
            exit 1
          fi

          verified=$(jq -r '.password_min_length // empty' "$dir/verified.json")
          if ! [[ "$verified" =~ ^[0-9]+$ ]] || [ "$verified" -lt 8 ]; then
            echo "::error::Auth password minimum is below 8 after update"
            exit 1
          fi

          echo "Auth password minimum verified: $verified characters" >> "$GITHUB_STEP_SUMMARY"
          echo "Auth password minimum verified: $verified characters"
