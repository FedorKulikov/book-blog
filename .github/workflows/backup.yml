name: Daily Supabase backup

on:
  schedule:
    # 03:00 UTC = 06:00 по Москве
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: dump → age → S3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Install age and awscli
        run: |
          sudo apt-get install -y --no-install-recommends age awscli

      - name: Validate configuration
        env:
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_DB_URL:-}" ] || { echo "::error::SUPABASE_DB_URL empty"; exit 1; }
          printf '%s' "${AGE_RECIPIENT:-}" | grep -qE '^age1[0-9a-z]{20,}$' \
            || { echo "::error::AGE_RECIPIENT invalid"; exit 1; }

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H%M)"
          FILE="db-${STAMP}.dump"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

          pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-privileges \
            --schema=public \
            --schema=auth \
            --format=custom \
            --file="$FILE"

          if [ ! -s "$FILE" ]; then
            echo "::error::$FILE is empty"
            exit 1
          fi

          # Проверка целостности архива до шифрования
          pg_restore --list "$FILE" > /dev/null

          ls -lh "$FILE"

      - name: Encrypt with age
        env:
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          age -r "$AGE_RECIPIENT" -o "${FILE}.age" "$FILE"
          rm -f "$FILE"

          if [ ! -s "${FILE}.age" ]; then
            echo "::error::encrypted file is empty"
            exit 1
          fi

          # Проверка магического заголовка age
          head -c 22 "${FILE}.age" | grep -q 'age-encryption.org' \
            || { echo "::error::not an age file"; exit 1; }

          # Контрольная сумма
          sha256sum "${FILE}.age" | awk '{print $1}' > "${FILE}.age.sha256"

          ls -lh "${FILE}.age"

      - name: Upload to S3 (Backblaze B2)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3 cp "${FILE}.age" "s3://${S3_BUCKET}/db/${FILE}.age" \
            --endpoint-url "$S3_ENDPOINT" --only-show-errors
          aws s3 cp "${FILE}.age.sha256" "s3://${S3_BUCKET}/db/${FILE}.age.sha256" \
            --endpoint-url "$S3_ENDPOINT" --only-show-errors
          echo "Uploaded: s3://${S3_BUCKET}/db/${FILE}.age"

      - name: Cleanup
        if: always()
        run: rm -f db-*.dump db-*.age db-*.age.sha256