name: Daily Supabase backup

on:
  # Временно отключено, пока не настроено приватное хранилище (S3)
  # schedule:
  #   - cron: '0 3 * * *'
  
  # Ручной запуск из вкладки Actions (для проверки, что дамп создается)
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Dump database with pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not set"
            exit 1
          fi
          
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-privileges \
            --schema=public \
            --file=db_backup.sql
            
          if [ ! -s db_backup.sql ]; then
            echo "::error::db_backup.sql is empty"
            exit 1
          fi
          
          ls -lh db_backup.sql
          echo "Backup size: $(wc -c < db_backup.sql) bytes"
          
          # ВНИМАНИЕ: Файл удалится после завершения job.
          # Здесь будет шаг загрузки в S3, когда мы его настроим.