name: Dependency security audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 2'

permissions:
  contents: write

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply compatible dependency security fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/npm-vulnerabilities' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm audit fix --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: update vulnerable dependency lockfile"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          else
            echo "No lockfile changes required."
          fi

      - name: npm audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          echo "audit_status=$audit_status" >> "$GITHUB_OUTPUT"

          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const rows = Object.values(report.vulnerabilities ?? {});
          const severity = ['critical', 'high', 'moderate', 'low', 'info'];
          const out = [
            '## npm audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...severity.map(level => `| ${level} | ${counts[level] ?? 0} |`),
            '',
            '| Package | Severity | Direct | Affected range | Fix available | Advisory |',
            '|---|---|---:|---|---|---|',
          ];

          for (const item of rows.sort((a, b) =>
            severity.indexOf(a.severity) - severity.indexOf(b.severity) ||
            a.name.localeCompare(b.name)
          )) {
            const advisories = (item.via ?? [])
              .map(v => typeof v === 'object'
              ? (v.url ? `[${v.title ?? 'advisory'}](${v.url})` : (v.title ?? 'advisory'))
              : String(v));
            const fix = item.fixAvailable === true ? 'yes (non-breaking)' :
              item.fixAvailable === false ? 'no automatic fix' :
              item.fixAvailable ? 'yes (may be breaking)' : 'unknown';
            out.push(`| ${item.name} | ${item.severity} | ${item.isDirect ? 'yes' : 'no'} | ${item.range ?? '—'} | ${fix} | ${advisories.join('<br>') || '—'} |`);
          }

          if (rows.length === 0) out.push('| — | — | — | — | — | No known vulnerabilities |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          console.log(out.join('\n'));
          NODE

      - name: Fail on high or critical vulnerabilities
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const high = (counts.high ?? 0) + (counts.critical ?? 0);
          if (high > 0) {
            console.error(`Found ${high} high/critical npm vulnerabilities.`);
            process.exit(1);
          }
          console.log('No high or critical npm vulnerabilities.');
          NODE
