name: Chat security smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/test-chat-security.ts'
      - '.github/workflows/chat-security-smoke.yml'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: chat-security-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify temporary chat access-control scenarios
        env:
          SUPABASE_URL: https://tbqjyaxbymntdqzldrjz.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/test-chat-security.ts
